# ==============================================================================
# WARNING: OPTIONAL — NOT TESTED
# This docker-compose.yml is provided for reference only. It has NOT been used
# or tested in any of the experiments documented in results/ or docs/. All
# documented experiments ran on native Windows PostgreSQL 16 and Memurai
# Developer (localhost:6379). Do NOT run any experiments or claim results from
# this file without independently validating the setup.
# ==============================================================================
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenantshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenantshield_db}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_password}
    ports:
      # Host port defaults to 5433 to avoid collision with existing local PostgreSQL on 5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tenantshield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tenantshield-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
